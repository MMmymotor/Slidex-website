<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Configurez votre porte piétonne automatique en deux minutes | SlideX</title>
  <meta name="description" content="Configurez votre porte piétonne automatique SlideX en deux minutes. Cliquez pour accéder au configurateur."/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml"/>
  <style>
    :root{
      --slx-blue: #2563eb; /* brand primary */
    }
    html, body { height: 100%; margin: 0; padding: 0; }
    html { background: var(--slx-blue); }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--slx-blue);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh; /* fallback */
      min-height: 100dvh; /* modern browsers incl. iOS */
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: pointer; /* click anywhere */
    }
    .wrap {
      text-align: center;
      padding: 40px 24px;
      max-width: 960px;
    }
    h1 {
      margin: 0 0 16px 0;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      font-size: clamp(36px, 6vw, 72px);
    }
    p {
      margin: 0 0 32px 0;
      font-size: clamp(16px, 2.2vw, 22px);
      opacity: 0.9;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      color: #1f2937;
      border-radius: 9999px;
      padding: 14px 22px;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(14px, 2vw, 18px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(0,0,0,0.18); }
    .hint { opacity: 0.7; font-size: 14px; margin-top: 16px; }
    .badge {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 9999px;
      padding: 6px 12px;
      font-size: 12px;
      backdrop-filter: saturate(140%) blur(6px);
    }
  </style>

<script src="js/includes-loader.js" type="text/javascript"></script>
</head>
<body>
  <div class="badge">SlideX</div>
  <div class="wrap" id="target">
  <h1>Configurez votre porte piétonne automatique en deux minutes</h1>
    <p>Touchez ou cliquez n'importe où pour ouvrir le configurateur.</p>
    <a class="btn" href="https://app.slidex.fr" id="cta">Ouvrir le configurateur →</a>
    <div class="hint">Raccourci: Entrée / Espace</div>
  </div>

  <script>
    (function(){
      const url = 'https://app.slidex.fr';
      const go = () => { window.location.href = url; };
      document.body.addEventListener('click', (e) => {
        // Avoid double navigation when clicking the explicit button
        if ((e.target instanceof HTMLElement) && e.target.closest('#cta')) return;
        go();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
      // Improve kiosk mode: hide cursor after idle
      let idle;
      const hide = () => document.body.style.cursor = 'none';
      const show = () => document.body.style.cursor = 'pointer';
      const reset = () => { show(); clearTimeout(idle); idle = setTimeout(hide, 2000); };
      ['mousemove','mousedown','touchstart'].forEach(evt => document.addEventListener(evt, reset, {passive:true}));
      reset();
    })();
  </script>
</body>
</html>
